name: Lab demo

# Runs the full lab end-to-end (app + original exploit) on every push and
# PR, so a public visitor can see it's actually working without having to
# clone the repo and run it themselves.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  run-exploit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run the lab + exploit
        run: ./run_demo.sh
